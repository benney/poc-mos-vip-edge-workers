<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edge worker playground</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2213%22 font-size=%2213%22>&#9889;</text></svg>">
<style>
:root {
  --bg: #fbfbfc; --panel: #fff; --line: #e2e4e9; --text: #1a1d23; --muted: #656c7a;
  --code-bg: #f5f6f8; --good: #0f7b4f; --warn: #9a5b00; --bad: #b3261e; --accent: #2f5fd0;
  font-synthesis: none;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161a; --panel: #1b1e24; --line: #2c313a; --text: #e6e8ec; --muted: #98a0ae;
    --code-bg: #14171c; --good: #4ec98a; --warn: #e0a54a; --bad: #ef7d72; --accent: #7aa2f7;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
header.top {
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  position: sticky; top: 0; z-index: 5;
}
header.top h1 { font-size: 15px; margin: 0; font-weight: 650; }
header.top .sep { color: var(--muted); }
header.top .spacer { flex: 1; }
select, input, textarea, button {
  font: inherit; color: var(--text); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px;
}
textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; width: 100%; resize: vertical; }
button {
  background: var(--accent); color: #fff; border-color: transparent; cursor: pointer; font-weight: 600; padding: 6px 14px;
}
button:disabled { opacity: .5; cursor: default; }
label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 10px 0 4px; font-weight: 600; }
.status { font-size: 12px; color: var(--muted); }
.status.good { color: var(--good); }
.status.bad { color: var(--bad); }
main { display: grid; grid-template-columns: minmax(340px, 30%) 1fr; gap: 0; align-items: start; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }
.inputs { padding: 4px 20px 40px; border-right: 1px solid var(--line); }
.outputs { padding: 4px 20px 40px; min-width: 0; }
.note { font-size: 12.5px; color: var(--muted); margin: 14px 0 0; padding: 10px 12px; background: var(--code-bg); border-radius: 6px; border-left: 3px solid var(--accent); }
.row { display: flex; gap: 8px; }
.row .grow { flex: 1; }
.check { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text); text-transform: none; letter-spacing: 0; margin-top: 12px; }
.check input { width: auto; }
.check.inline { margin-top: 0; font-size: 12px; color: var(--muted); }
.note.live, .note.warn { border-left-color: var(--warn); }
.note.warn { color: var(--warn); }
.hint.tight { margin: 5px 0 0; font-size: 11.5px; }
code { font-family: ui-monospace, monospace; font-size: .95em; }
textarea.ignored { opacity: .45; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 14px 0; min-width: 0; }
.card-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.card h3 { margin: 0; font-size: 13px; font-weight: 650; }
.card h4.sub { margin: 12px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
.pill { font-size: 11px; color: var(--muted); font-family: ui-monospace, monospace; }
.hint { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
pre.code {
  background: var(--code-bg); border-radius: 6px; padding: 10px 12px; margin: 0;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
  overflow-x: auto; white-space: pre; max-height: 340px; overflow-y: auto;
}
pre.code.bad { color: var(--bad); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; font-weight: 600; border: 1px solid var(--line); }
.badge.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
.badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.badge.neutral { color: var(--muted); }
iframe.preview { width: 100%; height: 260px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
</style>
</head>
<body>
<header class="top">
  <h1>Edge worker playground</h1>
  <span class="sep">·</span>
  <select id="preset" aria-label="Scenario"></select>
  <button id="run" disabled>Run</button>
  <label class="check inline"><input type="checkbox" id="live"> Live API</label>
  <label class="check inline" id="directWrap" hidden><input type="checkbox" id="liveDirect"> direct</label>
  <label class="check inline" id="originWrap" hidden><input type="checkbox" id="liveOrigin"> real origin</label>
  <span class="status" id="status">booting…</span>
  <span class="spacer"></span>
  <span class="pill">real release.wasm + real lol-html · ⌘/Ctrl+Enter</span>
</header>

<main>
  <div class="inputs">
    <p class="note" id="note"></p>
    <p class="note live" id="liveNote" hidden></p>

    <label for="env">Host env vars (getenv)</label>
    <textarea id="env" rows="7" spellcheck="false"></textarea>
    <p class="hint tight">If your worker sends a token from env, use a publishable one —
    this page is a browser, so never an <code>sk_</code> secret.</p>
    <p class="note warn" id="skWarning" hidden></p>

    <label>Client request</label>
    <div class="row">
      <input id="method" class="" size="6" aria-label="Method">
      <input id="url" class="grow" aria-label="URL">
    </div>

    <label for="reqHeaders">Request headers</label>
    <textarea id="reqHeaders" rows="5" spellcheck="false"></textarea>

    <label for="reqBody">Request body</label>
    <textarea id="reqBody" rows="3" spellcheck="false"></textarea>

    <label for="decisions"><span id="decisionsLabel">Fake API response (JSON)</span></label>
    <textarea id="decisions" rows="16" spellcheck="false"></textarea>
    <label class="check"><input type="checkbox" id="failDecisions"> Simulate decisions API failure</label>

    <label for="originStatus">Origin response status</label>
    <input id="originStatus" size="6">

    <label for="originHeaders">Origin response headers</label>
    <textarea id="originHeaders" rows="4" spellcheck="false"></textarea>

    <label for="originBody">Origin HTML</label>
    <textarea id="originBody" rows="14" spellcheck="false"></textarea>
  </div>

  <div class="outputs" id="output"></div>
</main>

<script src="ui.js"></script>
</body>
</html>
